name: Remote Controller HUD (Retrosyncwave) v24
slots:
    core:
        class: CoreUnit
    shield:
        class: ShieldGeneratorUnit
        select: manual
    db:
        class: DataBank
        select: manual
handlers:
    unit:
        onStart:
            lua: |
                -- PVPHud bundle (build 24) -- GENERATED, do not edit
                local __realRequire = require
                local __mods, __cache = {}, {}
                local function require(name)
                  if __cache[name] ~= nil then return __cache[name] end
                  local loader = __mods[name]
                  if loader then local m = loader(); __cache[name] = m; return m end
                  return __realRequire(name)
                end
                __mods['bootstrap_controller'] = function(...)
                -- Wires DU slots -> du adapters -> core logic -> render -> setScreen for the
                -- Remote Controller HUD. The only DU-coupled module besides du/.
                local format    = require("core.format")
                local theme     = require("core.theme")
                local channel   = require("core.channel")
                local resist    = require("core.resist")
                local ballistics= require("core.ballistics")
                local flightCalc= require("core.flight")
                local duShield  = require("du.shield")
                local duFlight  = require("du.flight")
                local duConstruct = require("du.construct")
                local controllerView = require("render.controller_view")

                local M = {}

                local RES_LABELS = { "ANTIMATTER", "ELECTROMAG", "KINETIC", "THERMIC" }

                function M.start(env)
                  local sys = env.system
                  local S = duShield.new(env.shield)
                  local F = duFlight.new(env.construct, env.unit)
                  local C = duConstruct.new(env.library) -- getPointOnScreen projection
                  local ch = channel.new(env.db, env.codec)
                  ch.seed()
                  local app = { autoResist = true, shieldAdapter = S, _brake = 0, _damping = 0, _warn = false }

                  function app.render()
                    local sw, sh = sys.getScreenWidth(), sys.getScreenHeight()

                    local mass = F.mass()
                    local speedMps = F.speed()
                    local throttle = F.throttlePct()
                    local brakeOn = app._brake == 1
                    local smooth = app._damping == 1
                    local flight = {
                      speed = format.speed(speedMps),
                      mass = format.compact(mass / 1000) .. " t",
                      maxSpeed = format.speed(ballistics.maxTargetSpeed(mass)),
                      throttleStr = string.format("%d%%", math.floor(throttle + 0.5)),
                      throttleBar = flightCalc.ratio(throttle, 100),
                      throttleRole = (throttle < 0) and "warn" or "ready",
                      engineRatio = F.engineRatio(),
                      outputG = string.format("%.1f g", F.accelG()),
                      brakeState = brakeOn and "BRAKE ON" or "BRAKE OFF",
                      brakeRole = brakeOn and "caution" or "base",
                      brakeDist = format.distance(flightCalc.brakeDistance(speedMps, F.maxBrake(), mass)),
                      rotMode = smooth and "SMOOTH" or "STABLE",
                      rotRole = smooth and "caution" or "base",
                    }

                    local shield = nil
                    if S.present() then
                      local res = S.resistances()
                      local lines = {}
                      for i = 1, 4 do
                        lines[i] = {
                          label = RES_LABELS[i],
                          value = string.format("%d%%", math.floor((res[i] or 0) * 100 + 0.5)),
                          role = "base",
                        }
                      end
                      local venting
                      if S.isVenting() then venting = "VENTING"
                      elseif S.ventCooldown() > 0 then venting = "COOLDOWN " .. math.ceil(S.ventCooldown()) .. "s"
                      else venting = "VENT READY" end
                      shield = {
                        hpPct = S.hpPct(),
                        hpRole = (S.hpPct() > 0.33) and "ready" or "threat",
                        lines = lines,
                        venting = venting,
                        auto = app.autoResist and "AUTO ON" or "AUTO OFF",
                      }
                    end

                    -- Move-direction (prograde) marker: project a point along the velocity vector.
                    local moveMarker = nil
                    local cn = env.construct
                    if cn and cn.getWorldPosition and cn.getWorldVelocity then
                      local function arr(t) return { t[1] or t.x or 0, t[2] or t.y or 0, t[3] or t.z or 0 } end
                      local vel = arr(cn.getWorldVelocity())
                      local vl = math.sqrt(vel[1] ^ 2 + vel[2] ^ 2 + vel[3] ^ 2)
                      if vl > 1 then
                        local pos = arr(cn.getWorldPosition())
                        local D = 1000
                        local scr = C.toScreen(
                          { x = pos[1] + vel[1] / vl * D, y = pos[2] + vel[2] / vl * D, z = pos[3] + vel[3] / vl * D },
                          sw, sh)
                        if scr then moveMarker = { x = scr.x, y = scr.y } end
                      end
                    end

                    local html = controllerView.build({
                      screenW = sw, screenH = sh, css = theme.css(),
                      flight = flight, shield = shield, markersSvg = "",
                      moveMarker = moveMarker, warn = app._warn,
                    })
                    sys.setScreen(html)
                    return html
                  end

                  -- Dynamic auto-resist: shift the resistance pool toward the highest incoming
                  -- damage type, when enabled, off cooldown, and there is meaningful stress.
                  function app.onFlush()
                    if not app.autoResist or not S.present() then return end
                    if S.cooldown() ~= 0 then return end
                    local stress = S.stressRatio()
                    if resist.isZero(stress) then return end
                    local target = resist.allocate(stress, S.pool())
                    if resist.shouldUpdate(target, S.resistances(), 0.01) then
                      S.setResistances(target[1], target[2], target[3], target[4])
                    end
                  end

                  -- brake/damping = the live brakeInput / dampingOff globals from the conf handlers.
                  function app.onUpdate(brake, damping, warn)
                    app._brake = brake or 0
                    app._damping = damping or 0
                    app._warn = warn and true or false
                    app.render()
                  end
                  function app.toggleAuto() app.autoResist = not app.autoResist end
                  function app.toggleVent()
                    if not S.present() then return end
                    if S.isVenting() then S.stopVenting() else S.startVenting() end
                  end

                  return app
                end

                return M
                end
                __mods['core.format'] = function(...)
                -- Pure number/distance/speed formatting. No DU globals.
                local M = {}

                -- 1234567 -> "1,234,567" (handles negatives).
                function M.groupThousands(n)
                  local s = tostring(math.floor(n))
                  local sign = ""
                  if s:sub(1, 1) == "-" then sign = "-"; s = s:sub(2) end
                  while true do
                    local r
                    s, r = s:gsub("^(%d+)(%d%d%d)", "%1,%2")
                    if r == 0 then break end
                  end
                  return sign .. s
                end

                -- metres -> m / km / su (1 su = 200 km).
                function M.distance(m)
                  if m < 1000 then
                    return math.ceil(m) .. "m"
                  elseif m < 100000 then
                    return string.format("%.1fkm", m / 1000)
                  else
                    return string.format("%.2fsu", m / 200000)
                  end
                end

                -- m/s -> "12,345 km/h". nil -> "".
                function M.speed(mps)
                  if mps == nil then return "" end
                  return M.groupThousands(math.floor(mps * 3.6)) .. " km/h"
                end

                -- 1500 -> "1.5k", 2300000 -> "2.3m".
                function M.compact(n)
                  if n < 1000 then
                    return tostring(math.floor(n))
                  elseif n < 1000000 then
                    return string.format("%.1fk", n / 1000)
                  else
                    return string.format("%.1fm", n / 1000000)
                  end
                end

                return M
                end
                __mods['core.theme'] = function(...)
                -- Retrosyncwave (classic synthwave) theme: palette + CSS/glow helpers.
                -- Pure data + string builders; no DU globals.
                local M = {}

                M.palette = {
                  base    = "#05d9e8", -- neon cyan: primary readouts
                  threat  = "#ff2a6d", -- hot magenta: enemies / damage-in
                  ready   = "#39ff14", -- neon green: friendly / good
                  caution = "#f9f002", -- electric yellow: warnings
                  warn    = "#ff6c11", -- neon orange: mid severity
                  panel   = "#0d0221", -- deep indigo: panel background
                  dim     = "#7700ff", -- violet: dead cores / faint grid
                }

                -- Semantic role -> hex; unknown role falls back to base.
                function M.color(role)
                  return M.palette[role] or M.palette.base
                end

                -- Neon glow as a CSS/SVG text-shadow string for a hex.
                function M.glow(hex, radius)
                  radius = radius or 6
                  return string.format("0 0 %dpx %s, 0 0 %dpx %s", radius, hex, radius * 2, hex)
                end

                -- Shared <style> block consumed by render/.
                function M.css()
                  local p = M.palette
                  local function rule(cls, hex)
                    return string.format(".%s{color:%s;text-shadow:%s;}", cls, hex, M.glow(hex))
                  end
                  return "<style>"
                    .. ".ui{font-family:monospace;font-weight:bold;white-space:pre;}"
                    .. rule("base", p.base)
                    .. rule("threat", p.threat)
                    .. rule("ready", p.ready)
                    .. rule("caution", p.caution)
                    .. rule("warn", p.warn)
                    .. "</style>"
                end

                return M
                end
                __mods['core.channel'] = function(...)
                -- Databank "bus" shared by the gunner and controller HUDs.
                -- Pure: operates on an injected databank object + optional JSON codec.
                local M = {}

                -- Shallow copy of a schema default so callers never mutate the shared instance.
                local function copyDefault(default)
                  local c = {}
                  for k, v in pairs(default) do c[k] = v end
                  return c
                end

                -- key -> { kind = "int"|"json", default = value }
                M.schema = {
                  pilotTarget  = { kind = "int",  default = 0 },
                  targetSpeed  = { kind = "int",  default = -1 },
                  GunnerSystem = { kind = "int",  default = 0 },
                  RedSquare    = { kind = "int",  default = 1 },
                  GreenSquare  = { kind = "int",  default = 0 },
                  YellowSquare = { kind = "int",  default = 1 },
                  BlueSquare   = { kind = "int",  default = 1 },
                  friendlist   = { kind = "json", default = {} },
                  deadCores    = { kind = "json", default = {} },
                }

                -- Build a channel over a databank object. codec = {encode=,decode=} or nil.
                function M.new(db, codec)
                  local self = {}

                  function self.seed()
                    if not db then return end
                    for key, spec in pairs(M.schema) do
                      if not db.hasKey(key) then
                        if spec.kind == "int" then
                          db.setIntValue(key, spec.default)
                        elseif codec then
                          db.setStringValue(key, codec.encode(spec.default))
                        end
                      end
                    end
                  end

                  function self.getInt(key)
                    local spec = M.schema[key]
                    if not db or not db.hasKey(key) then return spec.default end
                    return db.getIntValue(key)
                  end

                  function self.setInt(key, value)
                    if db then db.setIntValue(key, value) end
                  end

                  function self.getJson(key)
                    local spec = M.schema[key]
                    if not db or not codec or not db.hasKey(key) then
                      return copyDefault(spec.default)
                    end
                    return codec.decode(db.getStringValue(key)) or copyDefault(spec.default)
                  end

                  function self.setJson(key, value)
                    if db and codec then db.setStringValue(key, codec.encode(value)) end
                  end

                  return self
                end

                return M
                end
                __mods['core.resist'] = function(...)
                -- Pure dynamic auto-resist allocation. No DU globals.
                -- stressRatio: 1..4 array of incoming-damage fractions (DU getStressRatioRaw order:
                -- antimatter, electromagnetic, kinetic, thermic). pool: total resistance points.
                local M = {}

                function M.allocate(stressRatio, pool)
                  local out = {}
                  for i = 1, 4 do out[i] = (stressRatio[i] or 0) * pool end
                  return out
                end

                -- True when any component of newRes differs from current by more than eps.
                function M.shouldUpdate(newRes, current, eps)
                  eps = eps or 1
                  for i = 1, 4 do
                    if math.abs((newRes[i] or 0) - (current[i] or 0)) > eps then return true end
                  end
                  return false
                end

                -- True when no meaningful incoming stress (all four ~0).
                function M.isZero(stressRatio)
                  for i = 1, 4 do
                    if math.abs(stressRatio[i] or 0) > 1e-6 then return false end
                  end
                  return true
                end

                return M
                end
                __mods['core.ballistics'] = function(...)
                -- Pure PvP weapon math. No DU globals.
                local M = {}

                -- Distance color band vs a weapon's optimal range and spread.
                function M.rangeBand(distance, optimal, spread)
                  if distance <= optimal then return "ready"
                  elseif distance <= optimal + spread then return "caution"
                  else return "threat" end
                end

                -- Half the gap between optimal and max distance.
                function M.spread(maxDistance, optimalDistance)
                  return (maxDistance - optimalDistance) / 2
                end

                -- Angular-speed (deg/s) band vs a weapon's optimal tracking.
                function M.angularBand(angular, optimalTracking)
                  if optimalTracking <= 0 then return "threat" end
                  if angular <= optimalTracking then return "ready"
                  elseif angular <= optimalTracking * 2 then return "caution"
                  else return "threat" end
                end

                -- Hit-probability (0..100) band.
                function M.hitBand(hitPct)
                  if hitPct >= 70 then return "ready"
                  elseif hitPct >= 30 then return "caution"
                  else return "threat" end
                end

                -- Max attainable speed (m/s) for a target of given mass (kg).
                -- DU PvP speed-vs-mass curve; clamped between 20000 and 50000 km/h.
                function M.maxTargetSpeed(massKg)
                  local hi = 50000 / 3.6
                  local lo = 20000 / 3.6
                  local v = hi - 10713 * (massKg - 10000) / (853926 + massKg - 10000)
                  return math.max(math.min(hi, v), lo)
                end

                return M
                end
                __mods['core.flight'] = function(...)
                -- Pure flight telemetry math. No DU globals.
                local M = {}

                local G = 9.80665

                -- Acceleration (m/s^2) -> g.
                function M.toG(accelMps2)
                  return accelMps2 / G
                end

                -- Stopping distance (metres) from speed (m/s), max brake force (N) and mass (kg).
                -- distance = v^2 / (2 * a), a = brakeN / massKg. Returns 0 when inputs are unusable.
                function M.brakeDistance(speedMps, maxBrakeN, massKg)
                  if not maxBrakeN or maxBrakeN <= 0 or not massKg or massKg <= 0 then return 0 end
                  local a = maxBrakeN / massKg
                  return (speedMps * speedMps) / (2 * a)
                end

                -- Clamp a value/max into a 0..1 ratio (for bars). max<=0 -> 0.
                function M.ratio(value, max)
                  if not max or max <= 0 then return 0 end
                  local r = value / max
                  if r < 0 then return 0 end
                  if r > 1 then return 1 end
                  return r
                end

                return M
                end
                __mods['du.shield'] = function(...)
                -- Thin adapter over a DU ShieldGeneratorUnit. Tolerates a nil shield.
                local M = {}

                function M.new(shield)
                  local self = { shield = shield }

                  function self.present() return self.shield ~= nil end

                  function self.hpPct()
                    if not self.shield then return 0 end
                    local mx = self.shield.getMaxShieldHitpoints()
                    if mx <= 0 then return 0 end
                    return self.shield.getShieldHitpoints() / mx
                  end

                  function self.resistances() return self.shield.getResistances() end
                  function self.pool() return self.shield.getResistancesPool() end
                  function self.cooldown() return self.shield.getResistancesCooldown() end
                  function self.stressRatio() return self.shield.getStressRatioRaw() end
                  function self.isVenting() return self.shield.isVenting() end
                  function self.ventCooldown() return self.shield.getVentingCooldown() end
                  function self.setResistances(a, e, k, t) return self.shield.setResistances(a, e, k, t) end
                  function self.startVenting() return self.shield.startVenting() end
                  function self.stopVenting() return self.shield.stopVenting() end

                  return self
                end

                return M
                end
                __mods['du.flight'] = function(...)
                -- Thin adapter over DU flight data (construct + control unit). Returns plain numbers.
                -- Reads are guarded so a missing/renamed API degrades to 0 instead of crashing.
                local M = {}

                local G = 9.80665
                local LONG_TAGS = 'thrust analog longitudinal'

                local function vlen(v)
                  if type(v) ~= 'table' then return 0 end
                  local x, y, z = v[1] or 0, v[2] or 0, v[3] or 0
                  return math.sqrt(x * x + y * y + z * z)
                end

                local function num(fn)
                  local ok, r = pcall(fn)
                  if ok and type(r) == 'number' then return r end
                  return 0
                end

                function M.new(construct, unit)
                  local self = { construct = construct, unit = unit }

                  function self.speed()
                    return vlen(self.construct.getWorldVelocity())
                  end

                  function self.mass() return self.construct.getMass() end

                  -- Output acceleration magnitude in g.
                  function self.accelG()
                    return num(function() return vlen(self.construct.getWorldAcceleration()) end) / G
                  end

                  -- Commanded throttle percentage (-100..100). 0 without a control unit.
                  function self.throttlePct()
                    if not self.unit then return 0 end
                    return num(function() return self.unit.getThrottle() end)
                  end

                  -- Max brake force (N).
                  function self.maxBrake()
                    return num(function() return self.construct.getMaxBrake() end)
                  end

                  -- Actual longitudinal engine output as 0..1 of max (shows the warm-up ramp).
                  function self.engineRatio()
                    if not self.unit then return 0 end
                    local cur = num(function() return vlen(self.unit.getEngineThrust(LONG_TAGS)) end)
                    local maxN = 0
                    pcall(function()
                      local mt = self.construct.getMaxThrustAlongAxis(LONG_TAGS, self.construct.getOrientationForward())
                      if type(mt) == 'table' then
                        for _, v in ipairs(mt) do
                          if type(v) == 'number' and v > maxN then maxN = v end
                        end
                      end
                    end)
                    if maxN <= 0 then return 0 end
                    local r = cur / maxN
                    if r < 0 then return 0 elseif r > 1 then return 1 end
                    return r
                  end

                  return self
                end

                return M
                end
                __mods['du.construct'] = function(...)
                -- Thin adapter over DU world->screen projection. Returns plain tables.
                -- NOTE: getPointOnScreen lives on the `library` global in DU (not `construct`
                -- and not `system`) -- confirmed via the official api-mockup + GFL/ArchHUD HUDs.
                -- The caller passes that projector object to new().
                local M = {}

                function M.new(projector)
                  local self = { projector = projector }

                  -- pos {x,y,z} -> {x,y} screen pixels, or nil if behind the camera or if no
                  -- projector is available (degrade gracefully rather than crash).
                  function self.toScreen(pos, screenW, screenH)
                    local proj = self.projector
                    if not proj or not proj.getPointOnScreen then return nil end
                    local p = proj.getPointOnScreen({ pos.x, pos.y, pos.z })
                    if not p then return nil end
                    if p[3] ~= nil and p[3] <= 0 then return nil end
                    return { x = p[1] * screenW, y = p[2] * screenH }
                  end

                  return self
                end

                return M
                end
                __mods['render.controller_view'] = function(...)
                -- Pure controller HUD composition: view state -> HTML. No DU globals.
                local widgets = require("render.widgets")
                local M = {}

                local function svgOpen(w, h)
                  return string.format(
                    '<svg style="position:absolute;top:0;left:0;width:100vw;height:100vh;'
                    .. 'overflow:visible;pointer-events:none" viewBox="0 0 %d %d">', w, h)
                end

                function M.build(state)
                  local w, h = state.screenW, state.screenH
                  local p = { state.css or "", svgOpen(w, h) }

                  -- Flight panel (bottom-center): speed, throttle set + engine warm-up bars,
                  -- output g, and brake state + brake distance.
                  local f = state.flight
                  local fx, fy = w / 2 - 210, h - 250
                  p[#p + 1] = widgets.panel(fx, fy, 420, 220)
                  p[#p + 1] = widgets.text(fx + 14, fy + 26, "FLIGHT", "base", 18)
                  p[#p + 1] = widgets.text(fx + 300, fy + 26, f.rotMode or "STABLE", f.rotRole or "base", 15)
                  p[#p + 1] = widgets.text(fx + 14, fy + 50, "SPEED   " .. f.speed, "base", 15)
                  -- throttle SET
                  p[#p + 1] = widgets.text(fx + 14, fy + 78, "THR " .. f.throttleStr, f.throttleRole or "base", 15)
                  p[#p + 1] = widgets.bar(fx + 120, fy + 66, 286, 14, f.throttleBar, f.throttleRole or "ready")
                  -- ENGINE output (warm-up ramp toward the throttle set)
                  p[#p + 1] = widgets.text(fx + 14, fy + 104, "ENG", "base", 15)
                  p[#p + 1] = widgets.bar(fx + 120, fy + 92, 286, 14, f.engineRatio, "caution")
                  -- output acceleration in g
                  p[#p + 1] = widgets.text(fx + 14, fy + 130, "OUTPUT  " .. f.outputG, "base", 15)
                  -- brake state + always-on brake distance
                  p[#p + 1] = widgets.text(fx + 14, fy + 158, f.brakeState, f.brakeRole or "base", 16)
                  p[#p + 1] = widgets.text(fx + 210, fy + 158, "DIST " .. f.brakeDist, "base", 15)
                  -- mass / max speed
                  p[#p + 1] = widgets.text(fx + 14, fy + 192, "MASS " .. f.mass, "base", 13)
                  p[#p + 1] = widgets.text(fx + 220, fy + 192, "MAX " .. f.maxSpeed, "base", 13)

                  -- Shield panel (left)
                  local s = state.shield
                  if s then
                    local sx, sy = 20, h / 2 - 120
                    p[#p + 1] = widgets.panel(sx, sy, 300, 200)
                    p[#p + 1] = widgets.text(sx + 12, sy + 26, "SHIELD", "base", 18)
                    p[#p + 1] = widgets.bar(sx + 12, sy + 38, 276, 16, s.hpPct, s.hpRole or "ready")
                    for i, ln in ipairs(s.lines) do
                      local y = sy + 80 + (i - 1) * 22
                      p[#p + 1] = widgets.text(sx + 12, y, ln.label, "base", 14)
                      p[#p + 1] = widgets.text(sx + 150, y, ln.value, ln.role or "base", 14)
                    end
                    p[#p + 1] = widgets.text(sx + 12, sy + 180, s.venting, "caution", 14)
                    p[#p + 1] = widgets.text(sx + 170, sy + 180, s.auto, "ready", 14)
                  end

                  -- Move-direction (prograde) marker: a small ring where the ship is actually heading.
                  local mm = state.moveMarker
                  if mm then
                    p[#p + 1] = widgets.circle(mm.x, mm.y, 10, "ready", 0)
                    p[#p + 1] = widgets.circle(mm.x, mm.y, 2, "ready", 1)
                  end

                  -- Warning: braking while the throttle still commands thrust.
                  if state.warn then
                    p[#p + 1] = widgets.text(w / 2 - 150, h / 2 - 140, "! BRAKE + THROTTLE !", "threat", 24)
                  end

                  if state.markersSvg and state.markersSvg ~= "" then p[#p + 1] = state.markersSvg end
                  p[#p + 1] = "</svg>"
                  return table.concat(p)
                end

                return M
                end
                __mods['render.widgets'] = function(...)
                -- Pure SVG/HTML primitives for the HUD, themed via core.theme. No DU globals.
                local theme = require("core.theme")
                local M = {}

                -- XML-escape text content.
                function M.escape(s)
                  s = tostring(s)
                  s = s:gsub("&", "&amp;"):gsub("<", "&lt;"):gsub(">", "&gt;")
                  return s
                end

                -- Frame only: no background fill, light/transparent neon border.
                function M.panel(x, y, w, h)
                  return string.format(
                    '<rect x="%d" y="%d" width="%d" height="%d" fill="none" stroke="%s" stroke-opacity="0.25" stroke-width="1"/>',
                    x, y, w, h, theme.color("base"))
                end

                -- Neon SVG text (bright fill; glow is carried by the bright palette).
                function M.text(x, y, str, role, size)
                  return string.format(
                    '<text x="%d" y="%d" font-family="monospace" font-size="%d" fill="%s">%s</text>',
                    x, y, size or 16, theme.color(role or "base"), M.escape(str))
                end

                -- Horizontal progress bar: faint track + neon fill.
                function M.bar(x, y, w, h, pct, role)
                  pct = math.max(0, math.min(1, pct or 0))
                  local hex = theme.color(role or "ready")
                  return string.format(
                    '<rect x="%d" y="%d" width="%d" height="%d" fill="%s" fill-opacity="0.15"/>'
                    .. '<rect x="%d" y="%d" width="%d" height="%d" fill="%s" fill-opacity="0.8"/>',
                    x, y, w, h, hex, x, y, math.floor(w * pct), h, hex)
                end

                -- Half-transparent circle (e.g. weapon firing cone).
                function M.circle(x, y, r, role, fillOpacity)
                  local hex = theme.color(role or "base")
                  return string.format(
                    '<circle cx="%.1f" cy="%.1f" r="%.1f" fill="%s" fill-opacity="%.2f" stroke="%s" stroke-opacity="0.5" stroke-width="1.5"/>',
                    x, y, r, hex, fillOpacity or 0.12, hex)
                end

                -- Small '+' crosshair centered on (x,y).
                function M.crosshair(x, y, role, size)
                  size = size or 10
                  local hex = theme.color(role or "base")
                  return string.format(
                    '<line x1="%.1f" y1="%.1f" x2="%.1f" y2="%.1f" stroke="%s" stroke-width="1.5"/>'
                    .. '<line x1="%.1f" y1="%.1f" x2="%.1f" y2="%.1f" stroke="%s" stroke-width="1.5"/>',
                    x - size, y, x + size, y, hex, x, y - size, x, y + size, hex)
                end

                -- Polyline graph from y-values in 0..1 across a box.
                function M.graph(x, y, w, h, points, role)
                  if #points < 2 then return "" end
                  local hex = theme.color(role or "base")
                  local coords = {}
                  for i, p in ipairs(points) do
                    local px = x + (i - 1) / (#points - 1) * w
                    local py = y + (1 - math.max(0, math.min(1, p))) * h
                    coords[#coords + 1] = string.format("%.1f,%.1f", px, py)
                  end
                  return string.format(
                    '<polyline points="%s" fill="none" stroke="%s" stroke-width="1.5"/>',
                    table.concat(coords, " "), hex)
                end

                return M
                end
                local __entry = require('bootstrap_controller')
                system.showScreen(1)
                CtrlApp = require('bootstrap_controller').start({ system = system, construct = construct, unit = unit, library = library, shield = shield_1, db = db_1, codec = (db_1 ~= nil) and require('dkjson') or nil, build = 24 })

                -- Flight control (current DU Navigator API, per ArchHUD/GFL). Bare
                -- globals so the system action/flush handlers can read them.
                Nav = Navigator.new(system, core, unit)
                unit.hideWidget() -- hide the default control widget (it fights throttle/brake)
                pitchInput = 0
                rollInput = 0
                yawInput = 0
                brakeInput = 0
                dampingOff = 0 -- 0 = STABLE (rotation auto-damps), 1 = SMOOTH (holds spin)
                warnedLast = false
                warnSound = 'warning.mp3' --export: sound (in NQ/DualUniverse/audio) when braking with throttle
                local brakeToggle = true --export: Brake key toggles on/off (true) or is momentary hold (false)
                brakeToggleMode = brakeToggle
    system:
        onFlush:
            lua: |
                local rotationSpeed = 2 --export: flight rotation speed (rad/s)
                local torqueFactor = 1 --export: torque factor to reach rotationSpeed (high = unstable)
                local worldUp = vec3(construct.getWorldOrientationUp())
                local worldForward = vec3(construct.getWorldOrientationForward())
                local worldRight = vec3(construct.getWorldOrientationRight())
                local currentAngularVelocity = vec3(construct.getWorldAngularVelocity())
                local targetAngularVelocity
                if dampingOff == 1 and pitchInput == 0 and rollInput == 0 and yawInput == 0 then
                  -- SMOOTH mode, no input: hold the current spin (no auto-slowdown), per GFL_Pilot
                  targetAngularVelocity = currentAngularVelocity
                else
                  targetAngularVelocity = rotationSpeed * (pitchInput * worldRight + rollInput * worldForward + yawInput * worldUp):normalize()
                end
                local angularAccel = torqueFactor * (targetAngularVelocity - currentAngularVelocity)
                local airAcceleration = vec3(construct.getWorldAirFrictionAngularAcceleration())
                angularAccel = angularAccel - airAcceleration
                -- Modern split API (per ArchHUD/GFL). Do NOT mix the old combined
                -- setEngineCommand here -- it touches the linear-force channel with a
                -- zero vector and zeroes the brake force.
                Nav:setEngineTorqueCommand('torque', angularAccel, 1, 'airfoil', '', '', 1)
                -- Full flight command sequence mirroring GFL_Pilot's byThrottle path,
                -- in the same ORDER and with the same companion commands (lateral,
                -- vertical priority subtags, brake, boosters). Issuing the complete set
                -- is what lets the Navigator resolve the brake.
                local navCom = Nav.axisCommandManager
                -- longitudinal thrust (independent of braking)
                local longTags = 'thrust analog longitudinal'
                Nav:setEngineForceCommand(longTags, navCom:composeAxisAccelerationFromThrottle(longTags, axisCommandId.longitudinal), 1)
                -- Brake: official DU default formula (per paolo). setEngineForceCommand('brake')
                -- takes an ACCELERATION (not getMaxBrake force). The flat factor brings the
                -- ship fully to 0 (a force-based brake stalls around ~5 km/h).
                local brakeSpeedFactor = 3 --export: brake force scales with brakeSpeedFactor * velocity
                local brakeFlatFactor = 1 --export: flat brake force; brings the ship fully to a stop
                brakeSpeedFactor = math.max(brakeSpeedFactor, 0.01)
                brakeFlatFactor = math.max(brakeFlatFactor, 0.01)
                local cVel = vec3(core.getWorldVelocity())
                local cVelDir = vec3(core.getWorldVelocity()):normalize()
                local brakeAcceleration = -brakeInput * (brakeSpeedFactor * cVel + brakeFlatFactor * cVelDir)
                Nav:setEngineForceCommand('brake', brakeAcceleration)
                -- lateral strafe
                local latTags = 'thrust analog lateral'
                Nav:setEngineForceCommand(latTags, navCom:composeAxisAccelerationFromThrottle(latTags, axisCommandId.lateral), 1)
                -- vertical (with airfoil/ground priority subtags, per GFL)
                local vertTags = 'thrust analog vertical'
                Nav:setEngineForceCommand(vertTags, navCom:composeAxisAccelerationFromThrottle(vertTags, axisCommandId.vertical), 1, 'airfoil', 'ground', '', 1)
                -- boosters / rockets (fires retro-rockets)
                Nav:setBoosterCommand('rocket_engine')
                if CtrlApp then CtrlApp.onFlush() end
        onUpdate:
            lua: |
                Nav:update()
                -- Warn (message + sound) when braking while the throttle still commands thrust.
                local warnBT = (brakeInput == 1 and unit.getThrottle() > 0)
                if warnBT and not warnedLast then system.playSound(warnSound) end
                warnedLast = warnBT
                if CtrlApp then CtrlApp.onUpdate(brakeInput, dampingOff, warnBT) end
        onActionStart:
            args: [forward]
            lua: pitchInput = pitchInput - 1
        onActionStop:
            args: [forward]
            lua: pitchInput = pitchInput + 1
        onActionStart:
            args: [backward]
            lua: pitchInput = pitchInput + 1
        onActionStop:
            args: [backward]
            lua: pitchInput = pitchInput - 1
        onActionStart:
            args: [left]
            lua: rollInput = rollInput - 1
        onActionStop:
            args: [left]
            lua: rollInput = rollInput + 1
        onActionStart:
            args: [right]
            lua: rollInput = rollInput + 1
        onActionStop:
            args: [right]
            lua: rollInput = rollInput - 1
        onActionStart:
            args: [up]
            lua: |
                dampingOff = 1 - dampingOff
        onActionLoop:
            args: [up]
            lua: Nav.axisCommandManager:updateThrottleCommand(axisCommandId.vertical, 0.05)
        onActionLoop:
            args: [down]
            lua: Nav.axisCommandManager:updateThrottleCommand(axisCommandId.vertical, -0.05)
        onActionStart:
            args: [yawright]
            lua: yawInput = yawInput - 1
        onActionStop:
            args: [yawright]
            lua: yawInput = yawInput + 1
        onActionStart:
            args: [yawleft]
            lua: yawInput = yawInput + 1
        onActionStop:
            args: [yawleft]
            lua: yawInput = yawInput - 1
        onActionStart:
            args: [brake]
            lua: |
                if brakeToggleMode then brakeInput = 1 - brakeInput else brakeInput = 1 end
        onActionStop:
            args: [brake]
            lua: |
                if not brakeToggleMode then brakeInput = 0 end
        onActionStart:
            args: [stopengines]
            lua: Nav.axisCommandManager:setThrottleCommand(axisCommandId.longitudinal, 0)
        onActionLoop:
            args: [speedup]
            lua: Nav.axisCommandManager:updateThrottleCommand(axisCommandId.longitudinal, 0.05)
        onActionLoop:
            args: [speeddown]
            lua: Nav.axisCommandManager:updateThrottleCommand(axisCommandId.longitudinal, -0.05)
        onActionStart:
            args: [option6]
            lua: |
                if CtrlApp then CtrlApp.toggleAuto() end
        onActionStart:
            args: [option8]
            lua: |
                if CtrlApp then CtrlApp.toggleVent() end
