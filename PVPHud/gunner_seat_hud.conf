name: Gunner Seat HUD (Retrosyncwave) v21
slots:
    core:
        class: CoreUnit
    weapon:
        class: WeaponUnit
        select: manual
    radar:
        class: RadarPVPUnit
        select: manual
    db:
        class: DataBank
        select: manual
handlers:
    unit:
        onStart:
            lua: |
                -- PVPHud bundle (build 21) -- GENERATED, do not edit
                local __realRequire = require
                local __mods, __cache = {}, {}
                local function require(name)
                  if __cache[name] ~= nil then return __cache[name] end
                  local loader = __mods[name]
                  if loader then local m = loader(); __cache[name] = m; return m end
                  return __realRequire(name)
                end
                __mods['bootstrap_gunner'] = function(...)
                -- Wires DU slots -> du adapters -> core logic -> render -> setScreen.
                -- The only DU-coupled module besides du/. env carries the DU globals.
                local format     = require("core.format")
                local theme      = require("core.theme")
                local channel    = require("core.channel")
                local ballistics = require("core.ballistics")
                local weaponsLib = require("core.weapons")
                local dpsmod     = require("core.dps")
                local threat     = require("core.threat")
                local tracking   = require("core.tracking")
                local duWeapon   = require("du.weapon")
                local duRadar    = require("du.radar")
                local duConstruct= require("du.construct")
                local arLayer    = require("render.ar_layer")
                local gunnerView = require("render.gunner_view")

                local M = {}

                function M.start(env)
                  local sys = env.system
                  local W = duWeapon.new(env.weapon)
                  local R = duRadar.new(env.radar)
                  local C = duConstruct.new(env.library) -- getPointOnScreen lives on `library`
                  local ch = channel.new(env.db, env.codec)
                  ch.seed()
                  local dps = dpsmod.new({})
                  local track = tracking.new()
                  local app = { dps = dps, tracking = track, channel = ch }

                  local function avgHit(readings)
                    if #readings == 0 then return 0 end
                    local sum = 0
                    for _, r in ipairs(readings) do sum = sum + (r.hitProbability or 0) end
                    return math.floor(sum / #readings * 100 + 0.5)
                  end

                  function app.render()
                    local sw, sh = sys.getScreenWidth(), sys.getScreenHeight()
                    local readings = W.readings()
                    local spec = W.firstSpec()

                    -- weapons
                    local wlist = {}
                    for i, raw in ipairs(readings) do
                      local d = weaponsLib.describe(raw)
                      d.class = raw.class
                      wlist[i] = d
                    end

                    -- target panel
                    local target = nil
                    local tid = R.targetId()
                    if tid and tid ~= 0 then
                      local info = R.info(tid)
                      local optimal = spec and spec.optimalDistance or 0
                      local spread = spec and ballistics.spread(spec.maxDistance, spec.optimalDistance) or 0
                      local trackDeg = spec and spec.optimalTracking or 0
                      local hitPct = avgHit(readings)
                      target = {
                        name = (info.name or ""):sub(1, 16),
                        id3 = string.format("%03d", tid % 1000),
                        coreSize = info.coreSize or "?",
                        identified = info.identified,
                        dist = format.distance(info.distance),
                        distRole = ballistics.rangeBand(info.distance, optimal, spread),
                        optimal = format.distance(optimal),
                        angular = string.format("%d", math.floor(info.angular + 0.5)),
                        angularRole = ballistics.angularBand(info.angular, trackDeg),
                        hitPct = hitPct,
                        hitRole = ballistics.hitBand(hitPct),
                        speed = info.identified and format.speed(info.speed) or "?",
                        maxSpeed = format.speed(ballistics.maxTargetSpeed(info.mass or 0)),
                        closing = "-",
                      }
                    end

                    -- AR markers
                    local markers = {}
                    local t = sys.getUtcTime()
                    for _, id in ipairs(R.contacts()) do
                      local info = R.info(id)
                      if info.worldPos then
                        track.update(id, { x = info.worldPos[1], y = info.worldPos[2], z = info.worldPos[3] }, t)
                      end
                      local predicted = track.predict(id, t)
                      if predicted then
                        local scr = C.toScreen(predicted, sw, sh)
                        if scr then
                          local cls = threat.classify({
                            threatRate = info.threatRate, transponder = info.transponder,
                            abandoned = info.abandoned, identified = info.identified,
                          })
                          markers[#markers + 1] = {
                            x = scr.x, y = scr.y, role = cls.role,
                            label = string.format("%03d", id % 1000),
                            sub = format.distance(info.distance),
                          }
                        end
                      end
                    end

                    local stats = {
                      shotsFired = dps.shotsFired,
                      shotsHit = dps.shotsHit,
                      accuracy = string.format("%d%%", math.floor(dps.accuracy() * 100 + 0.5)),
                      peakDps = format.compact(dps.peakDps),
                      damage = format.compact(dps.damageDealt),
                    }

                    -- Forward crosshair + firing-cone circle. Project a point ahead of the ship
                    -- (construct forward) and a point offset by the weapon aiming cone; the screen
                    -- gap between them is the cone radius. aimingCone already includes skills/talents.
                    local crosshair = nil
                    local cn = env.construct
                    if cn and cn.getWorldPosition and cn.getWorldOrientationForward and cn.getWorldOrientationUp then
                      local function arr(t) return { t[1] or t.x or 0, t[2] or t.y or 0, t[3] or t.z or 0 } end
                      local function add3(a, b) return { a[1] + b[1], a[2] + b[2], a[3] + b[3] } end
                      local function scl(a, s) return { a[1] * s, a[2] * s, a[3] * s } end
                      local pos, fwd, up = arr(cn.getWorldPosition()), arr(cn.getWorldOrientationForward()), arr(cn.getWorldOrientationUp())
                      local D = 1000
                      local center = add3(pos, scl(fwd, D))
                      local cs = C.toScreen({ x = center[1], y = center[2], z = center[3] }, sw, sh)
                      if cs then
                        local radius = 0
                        local coneDeg = (spec and spec.aimingCone) or 0
                        if coneDeg > 0 then
                          local cr = math.rad(coneDeg)
                          local edgeDir = add3(scl(fwd, math.cos(cr)), scl(up, math.sin(cr)))
                          local edge = add3(pos, scl(edgeDir, D))
                          local es = C.toScreen({ x = edge[1], y = edge[2], z = edge[3] }, sw, sh)
                          if es then radius = math.sqrt((es.x - cs.x) ^ 2 + (es.y - cs.y) ^ 2) end
                        end
                        crosshair = { x = cs.x, y = cs.y, radius = radius }
                      end
                    end

                    local html = gunnerView.build({
                      screenW = sw, screenH = sh, css = theme.css(),
                      weapons = wlist, target = target, stats = stats, crosshair = crosshair,
                      graphSvg = "", markersSvg = arLayer.build(markers),
                    })
                    sys.setScreen(html)
                    return html
                  end

                  function app.onUpdate() app.render() end
                  function app.onWeaponHit(id, dmg) dps.recordHit(id, dmg) end
                  function app.onWeaponMiss(id) dps.recordMiss(id) end
                  function app.onDamage(amount) dps.recordReceived(amount) end
                  function app.onTick() dps.tick() end

                  return app
                end

                return M
                end
                __mods['core.format'] = function(...)
                -- Pure number/distance/speed formatting. No DU globals.
                local M = {}

                -- 1234567 -> "1,234,567" (handles negatives).
                function M.groupThousands(n)
                  local s = tostring(math.floor(n))
                  local sign = ""
                  if s:sub(1, 1) == "-" then sign = "-"; s = s:sub(2) end
                  while true do
                    local r
                    s, r = s:gsub("^(%d+)(%d%d%d)", "%1,%2")
                    if r == 0 then break end
                  end
                  return sign .. s
                end

                -- metres -> m / km / su (1 su = 200 km).
                function M.distance(m)
                  if m < 1000 then
                    return math.ceil(m) .. "m"
                  elseif m < 100000 then
                    return string.format("%.1fkm", m / 1000)
                  else
                    return string.format("%.2fsu", m / 200000)
                  end
                end

                -- m/s -> "12,345 km/h". nil -> "".
                function M.speed(mps)
                  if mps == nil then return "" end
                  return M.groupThousands(math.floor(mps * 3.6)) .. " km/h"
                end

                -- 1500 -> "1.5k", 2300000 -> "2.3m".
                function M.compact(n)
                  if n < 1000 then
                    return tostring(math.floor(n))
                  elseif n < 1000000 then
                    return string.format("%.1fk", n / 1000)
                  else
                    return string.format("%.1fm", n / 1000000)
                  end
                end

                return M
                end
                __mods['core.theme'] = function(...)
                -- Retrosyncwave (classic synthwave) theme: palette + CSS/glow helpers.
                -- Pure data + string builders; no DU globals.
                local M = {}

                M.palette = {
                  base    = "#05d9e8", -- neon cyan: primary readouts
                  threat  = "#ff2a6d", -- hot magenta: enemies / damage-in
                  ready   = "#39ff14", -- neon green: friendly / good
                  caution = "#f9f002", -- electric yellow: warnings
                  warn    = "#ff6c11", -- neon orange: mid severity
                  panel   = "#0d0221", -- deep indigo: panel background
                  dim     = "#7700ff", -- violet: dead cores / faint grid
                }

                -- Semantic role -> hex; unknown role falls back to base.
                function M.color(role)
                  return M.palette[role] or M.palette.base
                end

                -- Neon glow as a CSS/SVG text-shadow string for a hex.
                function M.glow(hex, radius)
                  radius = radius or 6
                  return string.format("0 0 %dpx %s, 0 0 %dpx %s", radius, hex, radius * 2, hex)
                end

                -- Shared <style> block consumed by render/.
                function M.css()
                  local p = M.palette
                  local function rule(cls, hex)
                    return string.format(".%s{color:%s;text-shadow:%s;}", cls, hex, M.glow(hex))
                  end
                  return "<style>"
                    .. ".ui{font-family:monospace;font-weight:bold;white-space:pre;}"
                    .. rule("base", p.base)
                    .. rule("threat", p.threat)
                    .. rule("ready", p.ready)
                    .. rule("caution", p.caution)
                    .. rule("warn", p.warn)
                    .. "</style>"
                end

                return M
                end
                __mods['core.channel'] = function(...)
                -- Databank "bus" shared by the gunner and controller HUDs.
                -- Pure: operates on an injected databank object + optional JSON codec.
                local M = {}

                -- Shallow copy of a schema default so callers never mutate the shared instance.
                local function copyDefault(default)
                  local c = {}
                  for k, v in pairs(default) do c[k] = v end
                  return c
                end

                -- key -> { kind = "int"|"json", default = value }
                M.schema = {
                  pilotTarget  = { kind = "int",  default = 0 },
                  targetSpeed  = { kind = "int",  default = -1 },
                  GunnerSystem = { kind = "int",  default = 0 },
                  RedSquare    = { kind = "int",  default = 1 },
                  GreenSquare  = { kind = "int",  default = 0 },
                  YellowSquare = { kind = "int",  default = 1 },
                  BlueSquare   = { kind = "int",  default = 1 },
                  friendlist   = { kind = "json", default = {} },
                  deadCores    = { kind = "json", default = {} },
                }

                -- Build a channel over a databank object. codec = {encode=,decode=} or nil.
                function M.new(db, codec)
                  local self = {}

                  function self.seed()
                    if not db then return end
                    for key, spec in pairs(M.schema) do
                      if not db.hasKey(key) then
                        if spec.kind == "int" then
                          db.setIntValue(key, spec.default)
                        elseif codec then
                          db.setStringValue(key, codec.encode(spec.default))
                        end
                      end
                    end
                  end

                  function self.getInt(key)
                    local spec = M.schema[key]
                    if not db or not db.hasKey(key) then return spec.default end
                    return db.getIntValue(key)
                  end

                  function self.setInt(key, value)
                    if db then db.setIntValue(key, value) end
                  end

                  function self.getJson(key)
                    local spec = M.schema[key]
                    if not db or not codec or not db.hasKey(key) then
                      return copyDefault(spec.default)
                    end
                    return codec.decode(db.getStringValue(key)) or copyDefault(spec.default)
                  end

                  function self.setJson(key, value)
                    if db and codec then db.setStringValue(key, codec.encode(value)) end
                  end

                  return self
                end

                return M
                end
                __mods['core.ballistics'] = function(...)
                -- Pure PvP weapon math. No DU globals.
                local M = {}

                -- Distance color band vs a weapon's optimal range and spread.
                function M.rangeBand(distance, optimal, spread)
                  if distance <= optimal then return "ready"
                  elseif distance <= optimal + spread then return "caution"
                  else return "threat" end
                end

                -- Half the gap between optimal and max distance.
                function M.spread(maxDistance, optimalDistance)
                  return (maxDistance - optimalDistance) / 2
                end

                -- Angular-speed (deg/s) band vs a weapon's optimal tracking.
                function M.angularBand(angular, optimalTracking)
                  if optimalTracking <= 0 then return "threat" end
                  if angular <= optimalTracking then return "ready"
                  elseif angular <= optimalTracking * 2 then return "caution"
                  else return "threat" end
                end

                -- Hit-probability (0..100) band.
                function M.hitBand(hitPct)
                  if hitPct >= 70 then return "ready"
                  elseif hitPct >= 30 then return "caution"
                  else return "threat" end
                end

                -- Max attainable speed (m/s) for a target of given mass (kg).
                -- DU PvP speed-vs-mass curve; clamped between 20000 and 50000 km/h.
                function M.maxTargetSpeed(massKg)
                  local hi = 50000 / 3.6
                  local lo = 20000 / 3.6
                  local v = hi - 10713 * (massKg - 10000) / (853926 + massKg - 10000)
                  return math.max(math.min(hi, v), lo)
                end

                return M
                end
                __mods['core.weapons'] = function(...)
                -- Pure weapon status -> display mapping. No DU globals.
                -- Status codes (DU WeaponUnit): 1 IDLE, 2 FIRING, 4 RELOADING, 5 UNLOADING, 6 BLOCKED.
                local M = {}

                function M.describe(raw)
                  local s = raw.status
                  local ammo = raw.ammoPct or 0
                  if not raw.operational then return { label = "BROKEN", role = "threat", barPct = 0 } end
                  if s == 4 then return { label = "RELOADING", role = "caution", barPct = 1 } end
                  if s == 5 then return { label = "UNLOADING", role = "caution", barPct = 1 } end
                  if ammo <= 0 then return { label = "RELOAD", role = "threat", barPct = 0 } end
                  if s == 6 then return { label = "BLOCKED", role = "threat", barPct = ammo } end
                  if ammo <= 0.1 then return { label = "LOW AMMO", role = "caution", barPct = ammo } end
                  if s == 2 then return { label = "FIRING", role = "ready", barPct = ammo } end
                  if s == 1 then return { label = "IDLE", role = "base", barPct = ammo } end
                  return { label = "ERROR", role = "threat", barPct = ammo }
                end

                return M
                end
                __mods['core.dps'] = function(...)
                -- Pure damage telemetry: rolling in/out buffers, stats, graph series.
                -- Stateful instance; no DU globals.
                local M = {}

                function M.new(opts)
                  opts = opts or {}
                  local n = opts.buckets or 90
                  local self = {
                    received = {}, caused = {},
                    shotsFired = 0, shotsHit = 0,
                    damageDealt = 0, damageById = {},
                    peakDps = 0, _window = opts.window or 10,
                  }
                  for i = 1, n do self.received[i] = 0; self.caused[i] = 0 end

                  function self.recordReceived(amount)
                    self.received[#self.received] = self.received[#self.received] + amount
                  end

                  function self.recordHit(targetId, damage)
                    self.caused[#self.caused] = self.caused[#self.caused] + damage
                    self.damageDealt = self.damageDealt + damage
                    self.damageById[targetId] = (self.damageById[targetId] or 0) + damage
                    self.shotsHit = self.shotsHit + 1
                    self.shotsFired = self.shotsFired + 1
                  end

                  function self.recordMiss(targetId)
                    self.shotsFired = self.shotsFired + 1
                  end

                  -- Update peak from the trailing window, then roll both buffers by one.
                  function self.tick()
                    local w = math.min(self._window, #self.caused)
                    local sum = 0
                    for i = #self.caused, #self.caused - w + 1, -1 do sum = sum + self.caused[i] end
                    local windowDps = sum / w
                    if windowDps > self.peakDps then self.peakDps = windowDps end
                    table.remove(self.received, 1); self.received[#self.received + 1] = 0
                    table.remove(self.caused, 1);   self.caused[#self.caused + 1] = 0
                  end

                  function self.accuracy()
                    if self.shotsFired == 0 then return 0 end
                    return self.shotsHit / self.shotsFired
                  end

                  function self.series(which)
                    local src = (which == "received") and self.received or self.caused
                    local out = {}
                    for i = 1, #src do out[i] = src[i] end
                    return out
                  end

                  return self
                end

                return M
                end
                __mods['core.threat'] = function(...)
                -- Pure construct classification for radar/AR. No DU globals.
                local M = {}

                -- info = { threatRate, transponder, friend, abandoned, identified }
                function M.classify(info)
                  if info.abandoned then
                    return { kind = "dead", role = "dim", identified = info.identified or false }
                  end
                  if info.friend or info.transponder then
                    return { kind = "friend", role = "ready", identified = info.identified or false }
                  end
                  return { kind = "enemy", role = "threat", identified = info.identified or false }
                end

                -- Theme role for a classified kind (AR marker color).
                function M.markerRole(kind)
                  if kind == "friend" then return "ready"
                  elseif kind == "dead" then return "dim"
                  else return "threat" end
                end

                return M
                end
                __mods['core.tracking'] = function(...)
                -- Pure AR position memory: caches world positions, estimates velocity,
                -- extrapolates when contact is lost, remembers dead-core positions.
                -- Plain {x,y,z} tables; no DU globals, no vec3 dependency.
                local M = {}

                local function sub(a, b) return { x = a.x - b.x, y = a.y - b.y, z = a.z - b.z } end
                local function add(a, b) return { x = a.x + b.x, y = a.y + b.y, z = a.z + b.z } end
                local function scale(a, s) return { x = a.x * s, y = a.y * s, z = a.z * s } end

                function M.new()
                  local self = { live = {}, dead = {} }

                  function self.update(id, pos, t)
                    local prev = self.live[id]
                    local vel = prev and prev.vel or nil
                    if prev then
                      local dt = t - prev.t
                      if dt > 0 then vel = scale(sub(pos, prev.pos), 1 / dt) end
                    end
                    self.live[id] = { pos = { x = pos.x, y = pos.y, z = pos.z }, t = t, vel = vel }
                  end

                  function self.predict(id, t)
                    local e = self.live[id]
                    if not e then return nil end
                    if e.vel then return add(e.pos, scale(e.vel, t - e.t)) end
                    return { x = e.pos.x, y = e.pos.y, z = e.pos.z }
                  end

                  function self.forget(id) self.live[id] = nil end

                  function self.markDead(id, pos)
                    self.dead[id] = { x = pos.x, y = pos.y, z = pos.z }
                  end

                  function self.deadCores()
                    local out = {}
                    for id, pos in pairs(self.dead) do out[id] = pos end
                    return out
                  end

                  function self.clearDead() self.dead = {} end

                  return self
                end

                return M
                end
                __mods['du.weapon'] = function(...)
                -- Thin adapter over a DU WeaponUnit array. Returns plain tables.
                local M = {}

                function M.new(weapons)
                  local self = { weapons = weapons or {} }

                  function self.count() return #self.weapons end

                  function self.readings()
                    local out = {}
                    for i, w in ipairs(self.weapons) do
                      local maxAmmo = w.getMaxAmmo()
                      out[i] = {
                        class = (w.getClass():match("Weapon(%a)")) or "?",
                        status = w.getStatus(),
                        operational = w.getOperationalState() == 1,
                        ammoPct = (maxAmmo > 0) and (w.getAmmoCount() / maxAmmo) or 0,
                        hitProbability = w.getHitProbability(),
                      }
                    end
                    return out
                  end

                  function self.firstSpec()
                    local w = self.weapons[1]
                    if not w then return nil end
                    return {
                      optimalDistance = w.getOptimalDistance(),
                      maxDistance = w.getMaxDistance(),
                      optimalTracking = w.getOptimalTracking(),
                      aimingCone = w.getOptimalAimingCone and w.getOptimalAimingCone() or 0,
                    }
                  end

                  return self
                end

                return M
                end
                __mods['du.radar'] = function(...)
                -- Thin adapter over a DU RadarPVPUnit. Returns plain tables.
                local M = {}

                function M.new(radar)
                  local self = { radar = radar }

                  function self.targetId() return self.radar.getTargetId() end
                  function self.contacts() return self.radar.getConstructIds() end

                  function self.info(id)
                    local r = self.radar
                    return {
                      name = r.getConstructName(id),
                      distance = r.getConstructDistance(id),
                      speed = r.getConstructSpeed(id),
                      mass = r.getConstructMass(id),
                      coreSize = r.getConstructCoreSize(id),
                      angular = r.getConstructAngularSpeed(id) * 180 / math.pi,
                      identified = r.isConstructIdentified(id),
                      abandoned = r.isConstructAbandoned(id),
                      threatRate = r.getThreatRateFrom(id),
                      transponder = r.hasMatchingTransponder(id),
                      worldPos = r.getConstructWorldPos(id),
                    }
                  end

                  return self
                end

                return M
                end
                __mods['du.construct'] = function(...)
                -- Thin adapter over DU world->screen projection. Returns plain tables.
                -- NOTE: getPointOnScreen lives on the `library` global in DU (not `construct`
                -- and not `system`) -- confirmed via the official api-mockup + GFL/ArchHUD HUDs.
                -- The caller passes that projector object to new().
                local M = {}

                function M.new(projector)
                  local self = { projector = projector }

                  -- pos {x,y,z} -> {x,y} screen pixels, or nil if behind the camera or if no
                  -- projector is available (degrade gracefully rather than crash).
                  function self.toScreen(pos, screenW, screenH)
                    local proj = self.projector
                    if not proj or not proj.getPointOnScreen then return nil end
                    local p = proj.getPointOnScreen({ pos.x, pos.y, pos.z })
                    if not p then return nil end
                    if p[3] ~= nil and p[3] <= 0 then return nil end
                    return { x = p[1] * screenW, y = p[2] * screenH }
                  end

                  return self
                end

                return M
                end
                __mods['render.ar_layer'] = function(...)
                -- Pure AR marker layout: projected screen coords -> SVG elements. No DU globals.
                local theme = require("core.theme")
                local M = {}

                function M.build(markers)
                  local out = {}
                  for _, m in ipairs(markers) do
                    local hex = theme.color(m.role or "threat")
                    out[#out + 1] = string.format(
                      '<rect x="%.1f" y="%.1f" width="20" height="20" fill="none" stroke="%s" stroke-width="2"/>',
                      m.x - 10, m.y - 10, hex)
                    if m.label then
                      out[#out + 1] = string.format(
                        '<text x="%.1f" y="%.1f" font-family="monospace" font-size="13" fill="%s" text-anchor="middle">%s</text>',
                        m.x, m.y - 14, hex, m.label)
                    end
                    if m.sub then
                      out[#out + 1] = string.format(
                        '<text x="%.1f" y="%.1f" font-family="monospace" font-size="13" fill="%s" text-anchor="middle">%s</text>',
                        m.x, m.y + 26, hex, m.sub)
                    end
                  end
                  return table.concat(out)
                end

                return M
                end
                __mods['render.gunner_view'] = function(...)
                -- Pure HUD composition: view state -> full HTML string. No DU globals.
                local widgets = require("render.widgets")
                local M = {}

                local function svgOpen(w, h)
                  return string.format(
                    '<svg style="position:absolute;top:0;left:0;width:100vw;height:100vh;'
                    .. 'overflow:visible;pointer-events:none" viewBox="0 0 %d %d">', w, h)
                end

                function M.build(state)
                  local w, h = state.screenW, state.screenH
                  local p = { state.css or "", svgOpen(w, h) }
                  -- Panels start below the game's own top-left/top-right HUD widgets.
                  local top = 120

                  -- Weapons panel (top-left)
                  local wn = #state.weapons
                  p[#p + 1] = widgets.panel(20, top, 360, 36 + wn * 26)
                  p[#p + 1] = widgets.text(32, top + 24, "WEAPONS", "base", 18)
                  for i, wp in ipairs(state.weapons) do
                    local y = top + 24 + i * 26
                    p[#p + 1] = widgets.text(32, y, (wp.class or "?") .. " " .. wp.label, wp.role, 15)
                    p[#p + 1] = widgets.bar(190, y - 12, 170, 14, wp.barPct, wp.role)
                  end

                  -- Telemetry panel (right side, mid-screen: top-right is used by game windows)
                  local sx = w - 320
                  local ty = h / 2 - 80
                  p[#p + 1] = widgets.panel(sx, ty, 300, 160)
                  p[#p + 1] = widgets.text(sx + 12, ty + 24, "TELEMETRY", "base", 18)
                  local st = state.stats
                  local lines = {
                    "FIRED   " .. st.shotsFired,
                    "HIT     " .. st.shotsHit,
                    "ACC     " .. st.accuracy,
                    "PEAK    " .. st.peakDps,
                    "DAMAGE  " .. st.damage,
                  }
                  for i, ln in ipairs(lines) do
                    p[#p + 1] = widgets.text(sx + 12, ty + 24 + i * 22, ln, "base", 15)
                  end
                  if state.graphSvg and state.graphSvg ~= "" then p[#p + 1] = state.graphSvg end

                  -- Target panel (center-top)
                  local t = state.target
                  if t then
                    local tx, ty = w / 2 - 180, h / 2 - 210
                    p[#p + 1] = widgets.panel(tx, ty, 360, 180)
                    p[#p + 1] = widgets.text(tx + 90, ty + 24,
                      "[" .. t.coreSize .. "] " .. t.id3 .. " " .. t.name, "base", 16)
                    if not t.identified then
                      p[#p + 1] = widgets.text(tx + 90, ty + 46, "UNIDENTIFIED", "threat", 14)
                    end
                    local rows = {
                      { "DIST", t.dist, t.distRole },
                      { "OPTIMAL", t.optimal, "base" },
                      { "ANG", t.angular .. " deg/s", t.angularRole },
                      { "HIT", t.hitPct .. "%", t.hitRole },
                      { "SPEED", t.speed, "base" },
                      { "MAXSPD", t.maxSpeed, "base" },
                      { "CLOSING", t.closing, "base" },
                    }
                    for i, r in ipairs(rows) do
                      local y = ty + 66 + (i - 1) * 15
                      p[#p + 1] = widgets.text(tx + 14, y, r[1], "base", 13)
                      p[#p + 1] = widgets.text(tx + 130, y, tostring(r[2]), r[3], 13)
                    end
                  end

                  -- Forward crosshair + firing-cone circle
                  local ch = state.crosshair
                  if ch then
                    if ch.radius and ch.radius > 2 then
                      p[#p + 1] = widgets.circle(ch.x, ch.y, ch.radius, "ready", 0.10)
                    end
                    p[#p + 1] = widgets.crosshair(ch.x, ch.y, "base", 10)
                  end

                  if state.markersSvg and state.markersSvg ~= "" then p[#p + 1] = state.markersSvg end
                  p[#p + 1] = "</svg>"
                  return table.concat(p)
                end

                return M
                end
                __mods['render.widgets'] = function(...)
                -- Pure SVG/HTML primitives for the HUD, themed via core.theme. No DU globals.
                local theme = require("core.theme")
                local M = {}

                -- XML-escape text content.
                function M.escape(s)
                  s = tostring(s)
                  s = s:gsub("&", "&amp;"):gsub("<", "&lt;"):gsub(">", "&gt;")
                  return s
                end

                -- Translucent neon glass panel.
                function M.panel(x, y, w, h)
                  return string.format(
                    '<rect x="%d" y="%d" width="%d" height="%d" fill="%s" fill-opacity="0.55" stroke="%s" stroke-opacity="0.6"/>',
                    x, y, w, h, theme.color("panel"), theme.color("base"))
                end

                -- Neon SVG text (bright fill; glow is carried by the bright palette).
                function M.text(x, y, str, role, size)
                  return string.format(
                    '<text x="%d" y="%d" font-family="monospace" font-size="%d" fill="%s">%s</text>',
                    x, y, size or 16, theme.color(role or "base"), M.escape(str))
                end

                -- Horizontal progress bar: faint track + neon fill.
                function M.bar(x, y, w, h, pct, role)
                  pct = math.max(0, math.min(1, pct or 0))
                  local hex = theme.color(role or "ready")
                  return string.format(
                    '<rect x="%d" y="%d" width="%d" height="%d" fill="%s" fill-opacity="0.15"/>'
                    .. '<rect x="%d" y="%d" width="%d" height="%d" fill="%s" fill-opacity="0.8"/>',
                    x, y, w, h, hex, x, y, math.floor(w * pct), h, hex)
                end

                -- Half-transparent circle (e.g. weapon firing cone).
                function M.circle(x, y, r, role, fillOpacity)
                  local hex = theme.color(role or "base")
                  return string.format(
                    '<circle cx="%.1f" cy="%.1f" r="%.1f" fill="%s" fill-opacity="%.2f" stroke="%s" stroke-opacity="0.5" stroke-width="1.5"/>',
                    x, y, r, hex, fillOpacity or 0.12, hex)
                end

                -- Small '+' crosshair centered on (x,y).
                function M.crosshair(x, y, role, size)
                  size = size or 10
                  local hex = theme.color(role or "base")
                  return string.format(
                    '<line x1="%.1f" y1="%.1f" x2="%.1f" y2="%.1f" stroke="%s" stroke-width="1.5"/>'
                    .. '<line x1="%.1f" y1="%.1f" x2="%.1f" y2="%.1f" stroke="%s" stroke-width="1.5"/>',
                    x - size, y, x + size, y, hex, x, y - size, x, y + size, hex)
                end

                -- Polyline graph from y-values in 0..1 across a box.
                function M.graph(x, y, w, h, points, role)
                  if #points < 2 then return "" end
                  local hex = theme.color(role or "base")
                  local coords = {}
                  for i, p in ipairs(points) do
                    local px = x + (i - 1) / (#points - 1) * w
                    local py = y + (1 - math.max(0, math.min(1, p))) * h
                    coords[#coords + 1] = string.format("%.1f,%.1f", px, py)
                  end
                  return string.format(
                    '<polyline points="%s" fill="none" stroke="%s" stroke-width="1.5"/>',
                    table.concat(coords, " "), hex)
                end

                return M
                end
                local __entry = require('bootstrap_gunner')
                system.showScreen(1)
                GunnerApp = require('bootstrap_gunner').start({ system = system, construct = construct, library = library, weapon = weapon, radar = radar_1, db = db_1, codec = (db_1 ~= nil) and require('dkjson') or nil, build = 21 })
                unit.setTimer('dpsTick', 1)
                -- Live default radar widget, as in the default autoconf.
                if radar_1 ~= nil then radar_1.showWidget() end
                -- All guns on ONE widget panel (instead of one widget per gun).
                gunnerWeaponData = {}
                if weapon ~= nil and system.createWidgetPanel ~= nil then
                  local panel = system.createWidgetPanel('WEAPONS')
                  for wi = 1, #weapon do
                    if weapon[wi] ~= nil then
                      local w = system.createWidget(panel, weapon[wi].getWidgetType())
                      local d = system.createData(weapon[wi].getWidgetData())
                      system.addDataToWidget(d, w)
                      gunnerWeaponData[wi] = d
                    end
                  end
                end
                function refreshGunnerWeapons()
                  if weapon == nil then return end
                  for wi = 1, #weapon do
                    if weapon[wi] ~= nil and gunnerWeaponData[wi] ~= nil then
                      system.updateData(gunnerWeaponData[wi], weapon[wi].getWidgetData())
                    end
                  end
                end

